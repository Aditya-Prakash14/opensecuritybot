    <radialGradient id="glow" cx="16%" cy="0%" r="85%">
      <stop offset="0" stop-color="#9fef00" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#9fef00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#070906"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="4" fill="#9fef00"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#1c2419"/>

  <g transform="translate(80 84) scale(2)">
    <path d="M16 3.6 5.4 7.9v7.7c0 5.7 4.3 10.1 10.6 12.8 6.3-2.7 10.6-7.1 10.6-12.8V7.9Z" fill="none" stroke="#9fef00" stroke-width="2" stroke-linejoin="round"/>
    <path d="m12.4 12.7 3.3 3.1-3.3 3.1" fill="none" stroke="#9fef00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16.9 18.9h3.4" fill="none" stroke="#9fef00" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <text x="172" y="146" font-size="52" font-weight="700" letter-spacing="-1" fill="#f2f6ee">opensecuritybot</text>

  <rect x="1012" y="104" width="108" height="42" rx="21" fill="none" stroke="#2b3526"/>
  <text x="1066" y="132" font-size="20" text-anchor="middle" fill="#8d9a86">v0.5.2</text>

  <text x="80" y="262" font-size="27" fill="#d6ddd0">The reasoning layer between your scanner and your report.</text>
  <text x="80" y="312" font-size="21" fill="#8d9a86">scope-safe · deterministic verify · reviewed skills · client-ready reports</text>

  <rect x="80" y="378" width="1040" height="148" rx="12" fill="#0b0f0a" stroke="#2b3526"/>
