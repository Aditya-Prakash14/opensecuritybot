  <text x="112" y="480" font-size="22" fill="#d6ddd0"><tspan fill="#9fef00">$</tspan> vapt scan --skill http-baseline --target https://app.acme.com</text>

  <text x="80" y="580" font-size="19" fill="#5f6b5a">MIT · Node 20+ · github.com/Aditya-Prakash14/opensecuritybot</text>
