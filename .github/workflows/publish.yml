name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token; required for npm provenance attestations

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    # Fork-friendly: only the canonical repo publishes to npm.
    if: github.repository_owner == 'Aditya-Prakash14'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: "npm"

      # Trusted publishing needs npm >= 11.5.1; the Node 22 image ships older.
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test

      # No token: npm verifies this workflow via OIDC (id-token: write above).
      # One-time setup on npmjs.com: opensecuritybot → Settings → Trusted Publisher
      # → GitHub Actions: Aditya-Prakash14/opensecuritybot, workflow "publish.yml".

      - name: Skip versions that are already on npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "opensecuritybot@$VERSION" version >/dev/null 2>&1; then
            echo "opensecuritybot@$VERSION already exists — nothing to publish"
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
          fi

      - name: Publish
        if: env.SKIP_PUBLISH != '1'
        run: npm publish --provenance --access public
